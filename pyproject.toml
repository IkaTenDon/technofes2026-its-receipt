[project]
name = "technofes2026-its-receipt"
version = "0.1.0"
description = "Offline Windows event receipt kiosk"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Pillow==13.0.0",
    "opencv-python==5.0.0.93",
    "qrcode==8.2",
    "pypdfium2==5.15.0",
    "bleak==3.0.2",
    "crc8==0.2.1",
    "pyserial==3.5",
    "platformdirs==4.14.5",
    "packaging==26.3",
    "winsdk==1.0.0b10; sys_platform == 'win32'",
]

[tool.uv]
package = false
required-version = ">=0.11.26"
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
